[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "valkyrie-command-centre"
version = "0.1.0"
description = "Standalone Command Centre module for Valkyrie Agent Studio"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=valkyrie_cc --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["valkyrie_cc"]

