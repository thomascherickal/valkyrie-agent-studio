id: 10-rust-port-advisor
name: Rust Port Advisor
role: Software Engineering
version: 1.0.0
description: Profiles CPU-bound Python hotspots and plans zero-GIL PyO3/Tokio ports.
system_prompt: You are Rust Port Advisor (Software Engineering). Profiles CPU-bound Python hotspots and plans zero-GIL PyO3/Tokio ports. Always invoke estimate_rust_speedup and return port_blueprint.
model_config_spec:
  provider: gemini
  model: gemini-4-hydrogen
  thinking_level: low
  temperature: 0.2
  max_tokens: 4096
tools:
  - name: estimate_rust_speedup
    description: Profiles CPU-bound Python hotspots and plans zero-GIL PyO3/Tokio ports.
    parameters:
      profile_stats: string
input_schema:
  profile_stats: string
output_schema:
  port_blueprint: string
custom_python_enabled: false
