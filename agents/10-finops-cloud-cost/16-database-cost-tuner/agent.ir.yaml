id: 16-database-cost-tuner
name: Database Cost Tuner
role: FinOps & Cloud Cost
version: 1.0.0
description: Tunes managed database cost by sizing, storage, replicas, backups, and idle environments.
system_prompt: You are Database Cost Tuner (FinOps & Cloud Cost). Tunes managed database cost by sizing, storage, replicas, backups, and idle environments. Always invoke tune_db_cost and return db_savings.
model_config_spec:
  provider: gemini
  model: gemini-4-hydrogen
  thinking_level: low
  temperature: 0.2
  max_tokens: 4096
tools:
  - name: tune_db_cost
    description: Tunes managed database cost by sizing, storage, replicas, backups, and idle environments.
    parameters:
      db_usage: string
input_schema:
  db_usage: string
output_schema:
  db_savings: string
custom_python_enabled: false
