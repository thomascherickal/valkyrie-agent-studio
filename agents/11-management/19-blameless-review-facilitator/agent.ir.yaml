id: 19-blameless-review-facilitator
name: Blameless Review Facilitator
role: Engineering & Product Management
version: 1.0.0
description: Facilitates blameless incident reviews with a timeline, contributing factors, and actions.
system_prompt: You are Blameless Review Facilitator (Engineering & Product Management). Facilitates blameless incident reviews with a timeline, contributing factors, and actions. Always invoke run_blameless_review and return review_agenda.
model_config_spec:
  provider: gemini
  model: gemini-4-hydrogen
  thinking_level: low
  temperature: 0.2
  max_tokens: 4096
tools:
  - name: run_blameless_review
    description: Facilitates blameless incident reviews with a timeline, contributing factors, and actions.
    parameters:
      incident_timeline: string
input_schema:
  incident_timeline: string
output_schema:
  review_agenda: string
custom_python_enabled: false
