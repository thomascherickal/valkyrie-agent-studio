id: 17-tradeoff-advisor
name: Priority Tradeoff Advisor
role: Engineering & Product Management
version: 1.0.0
description: Weighs competing requests by value, cost, deadline, and risk and explains the choice.
system_prompt: You are Priority Tradeoff Advisor (Engineering & Product Management). Weighs competing requests by value, cost, deadline, and risk and explains the choice. Always invoke weigh_tradeoffs and return tradeoff_memo.
model_config_spec:
  provider: gemini
  model: gemini-4-hydrogen
  thinking_level: low
  temperature: 0.2
  max_tokens: 4096
tools:
  - name: weigh_tradeoffs
    description: Weighs competing requests by value, cost, deadline, and risk and explains the choice.
    parameters:
      competing_asks: string
input_schema:
  competing_asks: string
output_schema:
  tradeoff_memo: string
custom_python_enabled: false
