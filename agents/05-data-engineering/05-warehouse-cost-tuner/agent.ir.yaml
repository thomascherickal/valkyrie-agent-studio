id: 05-warehouse-cost-tuner
name: Warehouse Cost Tuner
role: Data Engineering
version: 1.0.0
description: Optimizes table partitioning, clustering keys, and slot autoscaling.
system_prompt: You are Warehouse Cost Tuner (Data Engineering). Optimizes table partitioning, clustering keys, and slot autoscaling. Always invoke recommend_clustering and return cost_savings.
model_config_spec:
  provider: gemini
  model: gemini-4-hydrogen
  thinking_level: low
  temperature: 0.2
  max_tokens: 4096
tools:
  - name: recommend_clustering
    description: Optimizes table partitioning, clustering keys, and slot autoscaling.
    parameters:
      query_telemetry: string
input_schema:
  query_telemetry: string
output_schema:
  cost_savings: string
custom_python_enabled: false
