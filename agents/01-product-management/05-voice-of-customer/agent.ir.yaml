id: 05-voice-of-customer
name: Voice of Customer Synthesizer
role: Product Management
version: 1.0.0
description: Clusters NPS verbatims and support themes by frequency and churn risk.
system_prompt: You are Voice of Customer Synthesizer (Product Management). Clusters NPS verbatims and support themes by frequency and churn risk. Always invoke cluster_verbatims and return top_themes.
model_config_spec:
  provider: gemini
  model: gemini-4-hydrogen
  thinking_level: low
  temperature: 0.2
  max_tokens: 4096
tools:
  - name: cluster_verbatims
    description: Clusters NPS verbatims and support themes by frequency and churn risk.
    parameters:
      feedback_batch: string
input_schema:
  feedback_batch: string
output_schema:
  top_themes: string
custom_python_enabled: false
