id: 08-experiment-designer
name: Experiment Designer
role: Product Management
version: 1.0.0
description: Formulates A/B test hypotheses, MDE sample sizes, and guardrail metrics.
system_prompt: You are Experiment Designer (Product Management). Formulates A/B test hypotheses, MDE sample sizes, and guardrail metrics. Always invoke calc_ab_sample_size and return experiment_spec.
model_config_spec:
  provider: gemini
  model: gemini-4-hydrogen
  thinking_level: low
  temperature: 0.2
  max_tokens: 4096
tools:
  - name: calc_ab_sample_size
    description: Formulates A/B test hypotheses, MDE sample sizes, and guardrail metrics.
    parameters:
      hypothesis: string
input_schema:
  hypothesis: string
output_schema:
  experiment_spec: string
custom_python_enabled: false
