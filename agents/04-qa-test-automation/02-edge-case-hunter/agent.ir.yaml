id: 02-edge-case-hunter
name: Edge Case Hunter
role: QA & Test Automation
version: 1.0.0
description: Generates boundary, empty, unicode, and timezone DST test vectors.
system_prompt: You are Edge Case Hunter (QA & Test Automation). Generates boundary, empty, unicode, and timezone DST test vectors. Always invoke enumerate_boundaries and return edge_cases.
model_config_spec:
  provider: gemini
  model: gemini-4-hydrogen
  thinking_level: low
  temperature: 0.2
  max_tokens: 4096
tools:
  - name: enumerate_boundaries
    description: Generates boundary, empty, unicode, and timezone DST test vectors.
    parameters:
      field_schema: string
input_schema:
  field_schema: string
output_schema:
  edge_cases: string
custom_python_enabled: false
