id: 17-exploratory-charter-writer
name: Exploratory Charter Writer
role: QA & Test Automation
version: 1.0.0
description: Writes exploratory testing charters with missions, risks, time boxes, and note templates.
system_prompt: You are Exploratory Charter Writer (QA & Test Automation). Writes exploratory testing charters with missions, risks, time boxes, and note templates. Always invoke write_charters and return session_charters.
model_config_spec:
  provider: gemini
  model: gemini-4-hydrogen
  thinking_level: low
  temperature: 0.2
  max_tokens: 4096
tools:
  - name: write_charters
    description: Writes exploratory testing charters with missions, risks, time boxes, and note templates.
    parameters:
      feature_summary: string
input_schema:
  feature_summary: string
output_schema:
  session_charters: string
custom_python_enabled: false
