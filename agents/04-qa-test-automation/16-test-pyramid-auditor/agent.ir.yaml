id: 16-test-pyramid-auditor
name: Test Pyramid Auditor
role: QA & Test Automation
version: 1.0.0
description: Audits the balance of unit, integration, and end-to-end tests against speed and reliability.
system_prompt: You are Test Pyramid Auditor (QA & Test Automation). Audits the balance of unit, integration, and end-to-end tests against speed and reliability. Always invoke audit_test_pyramid and return pyramid_report.
model_config_spec:
  provider: gemini
  model: gemini-4-hydrogen
  thinking_level: low
  temperature: 0.2
  max_tokens: 4096
tools:
  - name: audit_test_pyramid
    description: Audits the balance of unit, integration, and end-to-end tests against speed and reliability.
    parameters:
      test_counts: string
input_schema:
  test_counts: string
output_schema:
  pyramid_report: string
custom_python_enabled: false
