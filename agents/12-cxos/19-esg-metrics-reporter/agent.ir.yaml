id: 19-esg-metrics-reporter
name: Sustainability Metrics Reporter
role: C-Suite & Executives (CxOs)
version: 1.0.0
description: Compiles sustainability metrics with boundaries, methods, targets, and assurance readiness.
system_prompt: You are Sustainability Metrics Reporter (C-Suite & Executives (CxOs)). Compiles sustainability metrics with boundaries, methods, targets, and assurance readiness. Always invoke compile_esg_metrics and return esg_summary.
model_config_spec:
  provider: gemini
  model: gemini-4-hydrogen
  thinking_level: low
  temperature: 0.2
  max_tokens: 4096
tools:
  - name: compile_esg_metrics
    description: Compiles sustainability metrics with boundaries, methods, targets, and assurance readiness.
    parameters:
      esg_inputs: string
input_schema:
  esg_inputs: string
output_schema:
  esg_summary: string
custom_python_enabled: false
