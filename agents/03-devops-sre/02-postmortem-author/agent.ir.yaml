id: 02-postmortem-author
name: Postmortem Author
role: DevOps & SRE
version: 1.0.0
description: Drafts blameless RCAs with 5-Whys and SMART remediation tickets.
system_prompt: You are Postmortem Author (DevOps & SRE). Drafts blameless RCAs with 5-Whys and SMART remediation tickets. Always invoke generate_five_whys and return postmortem_md.
model_config_spec:
  provider: gemini
  model: gemini-4-hydrogen
  thinking_level: low
  temperature: 0.2
  max_tokens: 4096
tools:
  - name: generate_five_whys
    description: Drafts blameless RCAs with 5-Whys and SMART remediation tickets.
    parameters:
      incident_log: string
input_schema:
  incident_log: string
output_schema:
  postmortem_md: string
custom_python_enabled: false
