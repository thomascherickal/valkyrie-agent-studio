id: 18-log-retention-tuner
name: Log Retention Tuner
role: DevOps & SRE
version: 1.0.0
description: Tunes log retention by value, compliance need, and storage cost per log class.
system_prompt: You are Log Retention Tuner (DevOps & SRE). Tunes log retention by value, compliance need, and storage cost per log class. Always invoke tune_log_retention and return retention_policy.
model_config_spec:
  provider: gemini
  model: gemini-4-hydrogen
  thinking_level: low
  temperature: 0.2
  max_tokens: 4096
tools:
  - name: tune_log_retention
    description: Tunes log retention by value, compliance need, and storage cost per log class.
    parameters:
      log_volumes: string
input_schema:
  log_volumes: string
output_schema:
  retention_policy: string
custom_python_enabled: false
